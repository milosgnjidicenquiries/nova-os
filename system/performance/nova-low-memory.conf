# Written to /etc/sysctl.d/99-nova-low-memory.conf only on machines with 1.5 GB of RAM
# or less that already have a zram device active. nova-performance records the values the
# running kernel used before this and restores them on rollback.

# Above 100 the kernel prefers moving idle anonymous pages into lz4 zram over dropping the
# page cache the foreground application just read. Without a zram device this would push
# work onto a slow disk, which is why the profile is gated on one being present.
vm.swappiness = 140

# Default 3 means 8 pages read per fault. One page per fault makes a swap-in on a 2008-era
# disk stall for less, which is what "the browser is still responsive" feels like.
vm.page-cluster = 0

# Reclaiming dentries and inodes less eagerly keeps the path lookups a spinning disk is
# slowest to redo, which pairs with swappiness above 100 pushing anonymous pages to zram.
vm.vfs_cache_pressure = 50

# The defaults are ratios of total RAM (10% background, 20% throttling), so on 1 GB the
# writer is only blocked once ~200 MB is dirty. Setting both limits in bytes caps the burst
# at 16 MB/64 MB; bytes take precedence over the ratios, so the same caps hold if RAM grows.
vm.dirty_background_bytes = 16777216
vm.dirty_bytes = 67108864
