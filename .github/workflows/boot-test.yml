name: Boot test Nova OS image

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag holding the image (leave empty for the newest draft)
        required: false
        default: ""
        type: string
      memory_mb:
        description: Guest RAM in MB
        required: false
        default: "2048"
        type: string
      boot_mode:
        description: Firmware to boot with
        type: choice
        options:
          - bios
          - uefi
        default: bios
      frames:
        description: Number of screenshots, one per minute
        required: false
        default: "30"
        type: string

# A read-only Actions token does not see draft releases, and the image is
# published as a draft precisely because it is untested.
permissions:
  contents: write

concurrency:
  group: boot-test
  cancel-in-progress: false

jobs:
  boot:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Reclaim runner disk space
        run: |
          set -Eeuo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          if command -v docker >/dev/null; then sudo docker system prune -af; fi
          df -h "$GITHUB_WORKSPACE"

      - name: Install QEMU
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y qemu-system-x86 qemu-utils ovmf imagemagick python3
          for tool in qemu-system-x86_64 convert python3; do
            command -v "$tool" >/dev/null || { echo "missing $tool"; exit 1; }
          done

      - name: Resolve the image release
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_INPUT: ${{ inputs.release_tag }}
        run: |
          set -Eeuo pipefail
          mkdir -p assets
          args=(--repo "$GITHUB_REPOSITORY" --dir assets --pattern 'nova-os-0.1.0-amd64.iso*' --pattern SHA256SUMS)
          if [ -n "$RELEASE_INPUT" ]; then args+=(--tag "$RELEASE_INPUT"); fi
          python3 .github/scripts/fetch-release-assets.py "${args[@]}"

      - name: Boot the image under TCG emulation and capture the screen
        run: |
          set -Eeuo pipefail
          python3 .github/scripts/join-parts.py --dir assets
          echo "Emulated boot: ${{ inputs.boot_mode }} firmware, ${{ inputs.memory_mb }} MB RAM, ${{ inputs.frames }} frames."
          python3 .github/scripts/boot-capture.py \
            --iso assets/nova-os-0.1.0-amd64.iso \
            --out boot \
            --memory "${{ inputs.memory_mb }}" \
            --mode "${{ inputs.boot_mode }}" \
            --count "${{ inputs.frames }}" \
            --interval 60

      - name: Upload boot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-${{ inputs.boot_mode }}-${{ inputs.memory_mb }}mb-${{ github.run_id }}
          path: |
            boot/
            assets/SHA256SUMS
          retention-days: 30
          if-no-files-found: warn
