name: Boot test Nova OS image

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag holding the image (leave empty for the newest draft)
        required: false
        default: ""
        type: string
      memory_mb:
        description: Guest RAM in MB
        required: false
        default: "2048"
        type: string
      boot_mode:
        description: Firmware to boot with
        type: choice
        options:
          - bios
          - uefi
        default: bios
      frames:
        description: Number of screenshots, one per minute
        required: false
        default: "30"
        type: string

permissions:
  contents: read

concurrency:
  group: boot-test
  cancel-in-progress: false

jobs:
  boot:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Reclaim runner disk space
        run: |
          set -Eeuo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          if command -v docker >/dev/null; then sudo docker system prune -af; fi
          df -h "$GITHUB_WORKSPACE"

      - name: Install QEMU
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y qemu-system-x86 qemu-utils ovmf imagemagick python3
          for tool in qemu-system-x86_64 convert python3; do
            command -v "$tool" >/dev/null || { echo "missing $tool"; exit 1; }
          done

      - name: Resolve the image release
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_INPUT: ${{ inputs.release_tag }}
        run: |
          set -Eeuo pipefail
          tag="$RELEASE_INPUT"
          if [ -z "$tag" ]; then
            tag=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq '[.[] | select(.draft)] | .[0].tag_name // empty')
          fi
          test -n "$tag" || { echo "No draft release found; run Build Nova OS ISO first." >&2; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY"

      - name: Download and reassemble the image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mkdir -p assets
          gh release download "${{ steps.target.outputs.tag }}" --repo "$GITHUB_REPOSITORY" --pattern 'nova-os-0.1.0-amd64.iso*' --pattern SHA256SUMS --dir assets
          python3 .github/scripts/join-parts.py --dir assets
          ls -la assets

      - name: Boot the image under TCG emulation and capture the screen
        run: |
          set -Eeuo pipefail
          echo "Emulated boot: ${{ inputs.boot_mode }} firmware, ${{ inputs.memory_mb }} MB RAM, ${{ inputs.frames }} one-minute frames."
          python3 .github/scripts/boot-capture.py \
            --iso assets/nova-os-0.1.0-amd64.iso \
            --out boot \
            --memory "${{ inputs.memory_mb }}" \
            --mode "${{ inputs.boot_mode }}" \
            --count "${{ inputs.frames }}" \
            --interval 60

      - name: Upload boot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-${{ inputs.boot_mode }}-${{ inputs.memory_mb }}mb-${{ steps.target.outputs.tag }}
          path: |
            boot/
            assets/SHA256SUMS
          retention-days: 30
          if-no-files-found: warn
